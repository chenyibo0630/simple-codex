[workspace]
resolver = "3"
members = ["core", "client", "app-server"]

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
# External
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
eventsource-stream = "0.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
toml = "0.9"
axum = "0.8"
async-stream = "0.3"

# Internal
simple-codex-core = { path = "core" }
simple-codex-client = { path = "client" }
simple-codex-app-server = { path = "app-server" }
